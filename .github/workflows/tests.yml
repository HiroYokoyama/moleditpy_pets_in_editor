name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The loader and settings tests exercise real Qt image I/O, so PySide6-Essentials and
      # its system libraries are installed (unlike the stub-only plugin repos).
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: pip install pytest pytest-cov PySide6-Essentials

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=pets_in_editor --cov-report=term-missing
